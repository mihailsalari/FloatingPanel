name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runs-on }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "5"
            xcode: "27.0"
            runs-on: xcode-27
          - swift: "5"
            xcode: "26.6"
            runs-on: macos-26
          - swift: "5"
            xcode: "16.4"
            runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Building in Swift ${{ matrix.swift }}
        run: xcodebuild -scheme FloatingPanel SWIFT_VERSION=${{ matrix.swift }} clean build

  test:
    runs-on: ${{ matrix.runs-on }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "27.0"
            xcode: "27.0"
            sim: "iPhone 18 Pro"
            parallel: NO # Stop random test job failures
            runs-on: xcode-27
          - os: "26.5"
            xcode: "26.6"
            sim: "iPhone 17 Pro"
            parallel: NO # Stop random test job failures
            runs-on: macos-26
          - os: "18.5"
            xcode: "16.4"
            sim: "iPhone 16 Pro"
            parallel: NO # Stop random test job failures
            runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Testing in iOS ${{ matrix.os }}
        run: |
          xcodebuild clean test \
            -workspace FloatingPanel.xcworkspace \
            -scheme FloatingPanel \
            -destination 'platform=iOS Simulator,OS=${{ matrix.os }},name=${{ matrix.sim }}' \
            -parallel-testing-enabled '${{ matrix.parallel }}'
    timeout-minutes: 20

  example:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: "Maps"
          - example: "Maps-SwiftUI"
          - example: "Stocks"
          - example: "Samples"
          - example: "SamplesObjC"
          - example: "SamplesSwiftUI"
    steps:
      - uses: actions/checkout@v7
      - name: Building ${{ matrix.example }}
        run: |
          xcodebuild clean build \
            -workspace FloatingPanel.xcworkspace \
            -scheme ${{ matrix.example }} \
            -sdk iphonesimulator

  swiftpm:
    runs-on: ${{ matrix.runs-on }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        xcode: ["27.0", "26.6", "16.4"]
        platform: [iphoneos, iphonesimulator]
        arch: [x86_64, arm64]
        exclude:
          - platform: iphoneos
            arch: x86_64
        include:
          # 27.x
          - platform: iphoneos
            xcode: "27.0"
            sys: "ios27.0"
            runs-on: xcode-27
          - platform: iphonesimulator
            xcode: "27.0"
            sys: "ios27.0-simulator"
            runs-on: xcode-27
          # 26.x
          - platform: iphoneos
            xcode: "26.6"
            sys: "ios26.5"
            runs-on: macos-26
          - platform: iphonesimulator
            xcode: "26.6"
            sys: "ios26.5-simulator"
            runs-on: macos-26
          # 18.5
          - platform: iphoneos
            xcode: "16.4"
            sys: "ios18.5"
            runs-on: macos-15
          - platform: iphonesimulator
            xcode: "16.4"
            sys: "ios18.5-simulator"
            runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: "Swift Package Manager build"
        run: |
          xcrun swift build \
            --sdk "$(xcrun --sdk ${{ matrix.platform }} --show-sdk-path)" \
            --triple "${{ matrix.arch }}-apple-${{ matrix.sys }}"

  cocoapods:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: "CocoaPods: pod lib lint"
        run: pod lib lint --allow-warnings --verbose
      - name: "CocoaPods: pod spec lint"
        run: pod spec lint --allow-warnings --verbose
